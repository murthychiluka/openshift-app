# Create all-in-one file
cat > openshift-app.yaml << 'EOF'
# ImageStream
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: flask-app
---
# BuildConfig
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: flask-app
spec:
  source:
    type: Git
    git:
      uri: https://github.com/murthychiluka/openshift-app.git
      ref: main
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: flask-app:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
---
# DeploymentConfig
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    app: flask-app
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - flask-app
        from:
          kind: ImageStreamTag
          name: flask-app:latest
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: flask-app:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: flask-app
spec:
  selector:
    app: flask-app
  ports:
    - port: 8080
      targetPort: 8080
---
# Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: flask-app
spec:
  to:
    kind: Service
    name: flask-app
  port:
    targetPort: 8080
  tls:
    termination: edge


