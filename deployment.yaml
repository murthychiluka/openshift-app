# deploymentconfig.yaml
# ──────────────────────────────────────
# DeploymentConfig = How to run your app
# Similar to K8s Deployment
# But with more features!

apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  # Number of pods
  replicas: 2

  selector:
    app: flask-app
    deploymentconfig: flask-app

  # Deployment strategy
  strategy:
    type: Rolling
    rollingParams:
      # Update 1 pod at a time
      maxSurge: 1
      maxUnavailable: 0
      # Wait for pod to be ready
      timeoutSeconds: 600

  # Auto deploy triggers
  triggers:
    # Deploy when image changes
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - flask-app
        from:
          kind: ImageStreamTag
          name: flask-app:latest
    # Deploy when config changes
    - type: ConfigChange

  template:
    metadata:
      labels:
        app: flask-app
        deploymentconfig: flask-app
    spec:
      containers:
        - name: flask-app
          # Uses ImageStream!
          image: flask-app:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
          - configMapRef:
            name: flask-config
          - secretRef:
            touchname: flask-secret

          # Environment variables
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8080"

          # Resource limits
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3